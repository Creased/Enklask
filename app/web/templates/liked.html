{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">

  <div class="mb-5 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 min-w-0">
      <a href="/" class="text-gray-400 hover:text-gray-700 shrink-0" title="Accueil">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l6-5 6 5M4 6v7h8V6"/></svg>
      </a>
      <h1 class="text-lg font-bold text-gray-900 truncate">Suivi des prix</h1>
      <span id="watch-count" class="text-sm text-gray-400 shrink-0">{{ summary.count }} suivi{{ "s" if summary.count != 1 else "" }}</span>
    </div>
    {% if summary.count %}
    <select name="sort"
            class="text-sm bg-warm-50 border-0 rounded-xl px-3 py-2 text-gray-700 focus:ring-2 focus:ring-brand/20 focus:outline-none shrink-0"
            hx-get="/partials/liked" hx-target="#watch-list" hx-swap="innerHTML"
            hx-trigger="change" hx-include="this">
      {% for key, label in sort_labels.items() %}
      <option value="{{ key }}" {% if key == selected_sort %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    {% endif %}
  </div>

  <div id="watch-summary">
    {% include "_watch_summary.html" %}
  </div>

  <div id="watch-list" class="flex flex-col gap-2">
    {% include "_watch_items.html" %}
  </div>

</div>
{% endblock %}
