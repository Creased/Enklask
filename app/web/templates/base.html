<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch Parts Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-slate-100 text-slate-800">
  <header class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold flex items-center gap-2">
        <span>🎮</span> Switch Parts Tracker
      </h1>
      <button
        class="bg-emerald-500 hover:bg-emerald-400 text-white text-sm font-medium px-4 py-2 rounded"
        hx-post="/refresh"
        hx-target="#grid"
        hx-swap="innerHTML"
        hx-indicator="#refresh-spinner"
      >
        <span id="refresh-spinner" class="htmx-indicator">⏳</span>
        Rafraîchir
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
