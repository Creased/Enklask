{% extends "base.html" %}
{% block content %}

<div class="mb-4 text-sm text-slate-600 flex items-center gap-2 flex-wrap">
  <span class="font-medium">Sources actives :</span>
  {% if enabled_sources %}
    {% for src in enabled_sources %}
    <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs">{{ src }}</span>
    {% endfor %}
  {% else %}
    <span class="text-amber-600">Aucune source configurée — renseigne tes clés dans <code>.env</code>.</span>
  {% endif %}
</div>

<form
  class="bg-white rounded-lg shadow-sm p-4 mb-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 text-sm"
  hx-get="/partials/listings"
  hx-target="#grid"
  hx-swap="innerHTML"
  hx-trigger="change, submit"
>
  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Source</span>
    <select name="source" class="border rounded px-2 py-1">
      <option value="">Toutes</option>
      {% for s in sources %}
      <option value="{{ s }}" {% if selected.source == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Modèle</span>
    <select name="model" class="border rounded px-2 py-1">
      <option value="">Tous</option>
      {% for m in models %}
      <option value="{{ m }}" {% if selected.model == m %}selected{% endif %}>{{ m }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Pièce</span>
    <select name="part" class="border rounded px-2 py-1">
      <option value="">Toutes</option>
      {% for p in parts %}
      <option value="{{ p }}" {% if selected.part == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Livraison</span>
    <select name="shipping" class="border rounded px-2 py-1">
      <option value="">Toutes</option>
      {% for key, label in shipping_labels.items() %}
      <option value="{{ key }}" {% if selected.shipping == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Prix max (€)</span>
    <input type="number" name="price_max" min="0" step="1"
           value="{{ selected.price_max or '' }}" class="border rounded px-2 py-1" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Distance max (km)</span>
    <input type="number" name="distance_max" min="0" step="5"
           value="{{ selected.distance_max or '' }}" class="border rounded px-2 py-1" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-500">Statut</span>
    <select name="status" class="border rounded px-2 py-1">
      <option value="">Actifs</option>
      {% for st in statuses %}
      <option value="{{ st }}" {% if selected.status == st %}selected{% endif %}>{{ st }}</option>
      {% endfor %}
    </select>
  </label>
</form>

<div id="grid">
  {% include "_grid.html" %}
</div>

{% endblock %}
